baseURL = 'https://Santimartiinez.github.io/'
defaultContentLanguage = 'es'
title = 'Santi Martínez'
theme = 'PaperMod'

[pagination]
  pagerSize = 5

[menu]
  [[menu.main]]
    identifier = "proyectos"
    name = "Proyectos"
    url = "/proyectos/"
    weight = 10
  [[menu.main]]
    identifier = "sobre-mi"
    name = "Sobre mí"
    url = "/sobre-mi/"
    weight = 20

[params]
  env = 'production'
  title = 'Santi Martínez'
  description = 'Portfolio de Santi Martínez - Ingeniería y Ciencia de Datos'
  author = 'Santi Martínez'

  # Tema claro/oscuro
  defaultTheme = 'auto' # o 'dark' si la quieres oscura por defecto
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false

  # Portada / Perfil
  [params.profileMode]
    enabled = true
    title = 'Santi Martínez'
    subtitle = 'Estudiante de Ingeniería de Datos | Data Science & Analytics'
    imageUrl = 'foto.jpg' # nombre de tu foto dentro de static/
    imageTitle = 'Santi Martínez'
    imageWidth = 150
    imageHeight = 150

    # Botones principales
    [[params.profileMode.buttons]]
      name = 'Proyectos'
      url = '/proyectos/'

    [[params.profileMode.buttons]]
      name = 'Sobre mí'
      url = '/sobre-mi/'

  # Iconos de redes sociales
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Santimartiinez'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://linkedin.com/in/tu-usuario'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:tu-correo@gmail.com'